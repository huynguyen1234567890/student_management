<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"> <!-- Khai bao namespace de dung th:* -->
<head>
<meta charset="UTF-8">
<title>Danh Sach Sinh Vien</title>
<!-- CSS don gian -->
<style>
body { font-family: sans-serif; padding: 20px; }
table { width: 70%; border-collapse: collapse;  margin: 20px auto; }
th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
th { background-color: #f2f2f2; }
</style>
<link rel="stylesheet" th:href="@{/css/students.css}">
</head>
<body>

<div class="toolbar">
    <form action="/students" method="GET">
        <input type="text" name="keyword" placeholder="Nhap ten..." />
        <button type="submit">TÌM KIẾM</button>
    </form>
    <a th:href="@{/students/new}">
        <button>THÊM</button>
    </a>

</div>

<h1>Danh sách sinh viên </h1>
<table>
<thead>
<tr>
<th>Họ và tên</th>
</tr>
</thead>
<tbody>
<!-- Cu phap Thymeleaf: Duyet qua danh sach "dsSinhVien" -->
<!-- th:each="bien_tam : ${key_trong_model}" -->
<tr th:each="student : ${dsSinhVien}">

    <td >
       <a th:href="@{/students/{id}(id=${student.id})}"
           th:text="${student.name}">
        </a>
    </td>  
 
</tr>
</tbody>
</table>


</body>
</html>
