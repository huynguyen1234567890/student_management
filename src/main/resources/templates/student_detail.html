<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"> <!-- Khai bao namespace de dung th:* -->
<head>
<meta charset="UTF-8">
<title>Danh Sach Sinh Vien</title>
<!-- CSS don gian -->
<style>
body { font-family: sans-serif; padding: 20px; }
table { width: 70%; border-collapse: collapse;  margin: 20px auto; }
th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
th { background-color: #f2f2f2; }
</style>
<link rel="stylesheet" th:href="@{/css/student_detail.css}">
</head>
<body>

<h1> THÔNG TIN SINH VIÊN </h1>

<table>
<thead>
<tr>
<th>id</th>
<th>name</th>
<th>email</th>
<th>age</th>
</tr>
</thead>
<tbody>
<!-- Cu phap Thymeleaf: Duyet qua danh sach "dsSinhVien" -->
<!-- th:each="bien_tam : ${key_trong_model}" -->
<tr>

    <td th:text = "${student.id}"></td>  
    <td th:text = "${student.name}"></td>  
    <td th:text = "${student.email}"></td>  
    <td th:text = "${student.age}"></td>  
 
</tr>
</tbody>
</table>
<div>
    <form th:action="@{/students/{id}(id=${student.id})}"
      method="post"
      onsubmit="return confirm('Xác nhận');">

        <input type="hidden" name="_method" value="delete"/>

        <button type="submit">XÓA</button>
    </form>

    <a th:href = "@{/students/{id}/update(id=${student.id})}">
        <button type="submit">CHỈNH SỬA</button>
    </a>
    

</div>

<a th:href = "@{/students}">
    quay lại
</a>

</body>
</html>
