<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"> <!-- Khai bao namespace de dung th:* -->
<head>
<meta charset="UTF-8">
<title>Danh Sach Sinh Vien</title>
<!-- CSS don gian -->
<style>
body { font-family: sans-serif; padding: 20px; }
{% comment %} table { width: 100%; border-collapse: collapse; margin-top: 20px; } {% endcomment %}
th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
th { background-color: #f2f2f2; }
</style>
<link rel="stylesheet" th:href="@{/css/add_student.css}">
</head>
<body>
    <h1>THÊM SINH VIÊN</h1>
    <form th:action="@{/students}" th:object="${huy}" method="post">

        <input type="text" th:field="*{id}" placeholder="MSSV">

        <input type="text" th:field="*{name}" placeholder="Tên">

        <input type="email" th:field="*{email}" placeholder="Email">

        <input type="number" th:field="*{age}" placeholder="Tuổi">

        <button type="submit">Save</button>

    </form>

    <a th:href = "@{/students}">
        quay lại
    </a>

</body>
</html>
